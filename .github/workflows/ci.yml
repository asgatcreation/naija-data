name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # used by release.yml to re-run every test before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Validate data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Validate data against schemas and rules
        run: python scripts/validate.py
      - name: Data tests
        run: python -m pytest -q
      - name: Packaged data matches data/
        run: python scripts/build/generate.py --check
      - name: Parity fixtures are up to date
        run: python scripts/build/make_fixtures.py --check

  python:
    name: Python ${{ matrix.python-version }}
    needs: data
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "packages/python[test]"
      - run: python -m pytest packages/python -q
      - name: Build wheel and test it in a clean environment
        run: |
          pip install build==1.3.0
          python -m build packages/python --outdir /tmp/dist
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install /tmp/dist/*.whl
          cd /tmp && /tmp/clean/bin/python -c "import naija_data as ng; assert ng.get_state('lagos').capital == 'Ikeja'"
          /tmp/clean/bin/naija bank 058

  django:
    name: Django ${{ matrix.django }} (Python ${{ matrix.python-version }})
    needs: data
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.10", django: "5.2" }
          - { python-version: "3.13", django: "5.2" }
          - { python-version: "3.13", django: "6.1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e packages/python -e "packages/django[test]" "Django~=${{ matrix.django }}.0"
      - run: python -m pytest
        working-directory: packages/django

  js:
    name: Node ${{ matrix.node-version }}
    needs: data
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    defaults:
      run:
        working-directory: packages/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run size
      - run: npm run bundle-check
      - name: npm 11 accepts package.json as is (nothing auto-corrected at publish)
        run: |
          npx -y npm@11.21.1 publish --dry-run --ignore-scripts 2>&1 | tee /tmp/publish.log
          test -x dist/cli.js
          if grep -qiE "auto-corrected|invalid and removed" /tmp/publish.log; then echo "::error::npm would change package.json at publish"; exit 1; fi
      - name: Pack and test in a clean project
        run: |
          npm pack --pack-destination /tmp
          mkdir /tmp/clean && cd /tmp/clean && npm init -y > /dev/null
          npm install /tmp/naija-data-*.tgz
          node -e "const ng = require('naija-data'); if (ng.getState('lagos').capital !== 'Ikeja') process.exit(1)"
          node --input-type=module -e "import { wards } from 'naija-data/wards'; if (wards('Ikeja', 'Lagos').length !== 10) process.exit(1)"
          npm install zod@4.6.5
          node --input-type=module -e "import { phoneSchema } from 'naija-data/zod'; if (phoneSchema().parse('0803 123 4567') !== '+2348031234567') process.exit(1)"
          npx naija bank 058

  api:
    name: REST API
    needs: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the naija-data package used by the API
        working-directory: packages/js
        run: npm ci && npm run build
      - working-directory: api
        run: |
          npm ci
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run --outdir /tmp/worker

  docs:
    name: Documentation website
    needs: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the naija-data package used by the playground
        working-directory: packages/js
        run: npm ci && npm run build
      - working-directory: docs/site
        run: |
          npm ci
          npm run build
          test -f dist/playground/index.html

  go:
    name: Go ${{ matrix.go-version }}
    needs: data
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "stable"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
