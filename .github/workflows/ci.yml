name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect packages
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.check.outputs.python }}
      js: ${{ steps.check.outputs.js }}
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          echo "python=$([ -f packages/python/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "js=$([ -f packages/js/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "go=$([ -f go/go.mod ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  data:
    name: Validate data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Validate data against schemas and rules
        run: python scripts/validate.py
      - name: Data tests
        run: python -m pytest -q

  python:
    name: Python package
    needs: [data, detect]
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "packages/python[test]"
      - run: python -m pytest packages/python -q

  js:
    name: JavaScript package
    needs: [data, detect]
    if: needs.detect.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: packages/js
      - run: npm test
        working-directory: packages/js

  go:
    name: Go module
    needs: [data, detect]
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
        working-directory: go
      - run: go test ./...
        working-directory: go
