name: Deploy

# Deploys the API (api/) and the documentation website (docs/site/) to Cloudflare when main
# changes and CI passes.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
# Until both exist, this workflow skips the deploy instead of failing.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check that Cloudflare secrets are configured
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Cloudflare secrets not set; skipping deploy."; fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Build the naija-data package used by the API
        if: steps.secrets.outputs.ok == 'true'
        working-directory: packages/js
        run: npm ci && npm run build
      - name: Install, test and deploy
        if: steps.secrets.outputs.ok == 'true'
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npm test
          npx wrangler deploy --var API_VERSION:${GITHUB_SHA::7}
      - name: Build and deploy the documentation website
        if: steps.secrets.outputs.ok == 'true'
        working-directory: docs/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npm run build
          npx --prefix ../../api wrangler deploy
      - name: Check the live API and website
        if: steps.secrets.outputs.ok == 'true'
        run: |
          sleep 10
          curl -fsS https://naija-data-api.asgatcreation.workers.dev/v1/health
          curl -fsS -o /dev/null https://naija-data.asgatcreation.workers.dev/playground/
