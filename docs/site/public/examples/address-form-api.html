<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>State → LGA → ward form (REST API) · naija-data example</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    select, button { width: 100%; padding: 0.5rem; font: inherit; margin-top: 0.25rem; }
    button { margin-top: 1.5rem; }
    pre { background: #f4f4f4; padding: 0.75rem; white-space: pre-wrap; }
    small { color: #555; }
  </style>
</head>
<body>
  <h1>Register</h1>
  <p><small>Example from the <a href="/guides/state-lga-form/">naija-data guide</a>. Lists come from the free naija-data REST API.</small></p>

  <form id="register">
    <label for="state">State</label>
    <select id="state" name="state" required>
      <option value="">Loading states…</option>
    </select>

    <label for="lga">Local Government Area</label>
    <select id="lga" name="lga" required disabled>
      <option value="">Choose a state first</option>
    </select>

    <label for="ward">Ward (optional)</label>
    <select id="ward" name="ward" disabled>
      <option value="">Choose an LGA first</option>
    </select>

    <button type="submit">Submit</button>
  </form>
  <pre id="result" hidden></pre>

  <script>
    const API = "https://naija-data-api.asgatcreation.workers.dev/v1";
    const stateSelect = document.getElementById("state");
    const lgaSelect = document.getElementById("lga");
    const wardSelect = document.getElementById("ward");

    // Fill a <select> with one <option> per record: value = code, text = name.
    function fill(select, records, placeholder) {
      select.replaceChildren(new Option(placeholder, ""), ...records.map((r) => new Option(r.name, r.code)));
      select.disabled = records.length === 0;
    }

    async function getList(path) {
      const res = await fetch(API + path);
      if (!res.ok) throw new Error(`naija-data API: ${res.status}`);
      return (await res.json()).data; // lists look like { count, data: [...] }
    }

    // 1. States, when the page loads.
    getList("/states").then((states) => fill(stateSelect, states, "Choose a state"));

    // 2. When a state is chosen, load its LGAs.
    stateSelect.addEventListener("change", async () => {
      fill(lgaSelect, [], "Loading…");
      fill(wardSelect, [], "Choose an LGA first");
      if (!stateSelect.value) return fill(lgaSelect, [], "Choose a state first");
      fill(lgaSelect, await getList(`/states/${stateSelect.value}/lgas`), "Choose an LGA");
    });

    // 3. When an LGA is chosen, load its wards.
    lgaSelect.addEventListener("change", async () => {
      fill(wardSelect, [], "Loading…");
      if (!lgaSelect.value) return fill(wardSelect, [], "Choose an LGA first");
      fill(wardSelect, await getList(`/lgas/${lgaSelect.value}/wards`), "Choose a ward");
    });

    // The form sends codes: state "LA", LGA "NG025011", ward "24-11-01".
    document.getElementById("register").addEventListener("submit", (e) => {
      e.preventDefault();
      const out = document.getElementById("result");
      out.hidden = false;
      out.textContent = JSON.stringify(Object.fromEntries(new FormData(e.target)), null, 2);
    });
  </script>
</body>
</html>
