<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-label="A registration form using naija-data: state, LGA and ward dropdowns, a validated phone number and a validated bank account number">
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b3d2a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="340" height="310" rx="18" fill="#ffffff" filter="url(#s)"/>
  <rect x="10" y="10" width="340" height="44" rx="18" fill="#008751"/>
  <rect x="10" y="36" width="340" height="18" fill="#008751"/>
  <text x="30" y="38" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Register</text>
  <circle cx="318" cy="32" r="5" fill="#ffffff" opacity="0.5"/><circle cx="302" cy="32" r="5" fill="#ffffff" opacity="0.5"/>

  <g font-family="system-ui, sans-serif">
    <text x="30" y="80" font-size="10" font-weight="600" fill="#5b6470">STATE</text>
    <rect x="30" y="86" width="140" height="30" rx="7" fill="#f3f7f5" stroke="#cfe3d9"/>
    <text x="42" y="105" font-size="13" fill="#1d2329">Lagos</text>
    <path d="M152 98 l5 5 l5 -5" fill="none" stroke="#008751" stroke-width="2" stroke-linecap="round"/>

    <text x="190" y="80" font-size="10" font-weight="600" fill="#5b6470">LGA</text>
    <rect x="190" y="86" width="140" height="30" rx="7" fill="#f3f7f5" stroke="#008751" stroke-width="1.5"/>
    <text x="202" y="105" font-size="13" fill="#1d2329">Ikeja</text>
    <path d="M312 98 l5 5 l5 -5" fill="none" stroke="#008751" stroke-width="2" stroke-linecap="round"/>

    <rect x="190" y="120" width="140" height="78" rx="7" fill="#ffffff" stroke="#cfe3d9"/>
    <text x="202" y="138" font-size="12" fill="#5b6470">Agege</text>
    <rect x="194" y="145" width="132" height="20" rx="5" fill="#e3f3ec"/>
    <text x="202" y="159" font-size="12" font-weight="600" fill="#006b40">Ikeja</text>
    <text x="202" y="185" font-size="12" fill="#5b6470">Ikorodu</text>

    <text x="30" y="140" font-size="10" font-weight="600" fill="#5b6470">WARD</text>
    <rect x="30" y="146" width="140" height="30" rx="7" fill="#f3f7f5" stroke="#cfe3d9"/>
    <text x="42" y="165" font-size="13" fill="#1d2329">Anifowoshe</text>

    <text x="30" y="214" font-size="10" font-weight="600" fill="#5b6470">PHONE</text>
    <rect x="30" y="220" width="300" height="30" rx="7" fill="#f3f7f5" stroke="#cfe3d9"/>
    <text x="42" y="239" font-size="13" fill="#1d2329">0803 123 4567</text>
    <text x="318" y="239" font-size="11" fill="#008751" text-anchor="end">✓ +2348031234567 · MTN</text>

    <text x="30" y="270" font-size="10" font-weight="600" fill="#5b6470">ACCOUNT NUMBER</text>
    <rect x="30" y="276" width="300" height="30" rx="7" fill="#f3f7f5" stroke="#cfe3d9"/>
    <text x="42" y="295" font-size="13" fill="#1d2329">0000014579</text>
    <text x="318" y="295" font-size="11" fill="#008751" text-anchor="end">✓ valid for First Bank</text>
  </g>
</svg>
